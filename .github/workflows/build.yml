name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setup Android Platform & Convert Uploaded Assets
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=mj_jigsaw

          # 创建 assets 目录
          mkdir -p assets

          # 将根目录上传的 6 张不同格式图片统一转码成 PNG 放入 assets 目录
          convert my_mj1.jpeg assets/mj1.png
          convert my_mj2.jpg assets/mj2.png
          convert my_mj3.jpg assets/mj3.png
          convert my_mj4.webp assets/mj4.png
          convert my_mj5.jpg assets/mj5.png
          convert my_mj6.jpg assets/mj6.png

          # 自动配置 pubspec.yaml 中的 assets 声明
          if ! grep -q "assets:" pubspec.yaml; then
            echo "  assets:" >> pubspec.yaml
            echo "    - assets/mj1.png" >> pubspec.yaml
            echo "    - assets/mj2.png" >> pubspec.yaml
            echo "    - assets/mj3.png" >> pubspec.yaml
            echo "    - assets/mj4.png" >> pubspec.yaml
            echo "    - assets/mj5.png" >> pubspec.yaml
            echo "    - assets/mj6.png" >> pubspec.yaml
          fi

          # 自动用第一张图片生成桌面图标 App Icon
          convert my_mj1.jpeg -resize 512x512! icon.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
