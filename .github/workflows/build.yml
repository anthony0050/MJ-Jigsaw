name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Reconstruct Android Platform & Set MJ Icon
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=mj_jigsaw
          # 云端自动下载 MJ 图标并覆盖默认 Android 图标
          curl -s -L "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=512&auto=format&fit=crop" -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          curl -s -L "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=512&auto=format&fit=crop" -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          curl -s -L "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=512&auto=format&fit=crop" -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          curl -s -L "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=512&auto=format&fit=crop" -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          curl -s -L "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=512&auto=format&fit=crop" -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
