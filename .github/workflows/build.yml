name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Setup Android Platform & Local Assets
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=mj_jigsaw

          # 创建 assets 目录并下载拼图本地资源
          mkdir -p assets
          curl -s -L "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&auto=format&fit=crop" -o temp1.jpg
          curl -s -L "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=800&auto=format&fit=crop" -o temp2.jpg
          curl -s -L "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=800&auto=format&fit=crop" -o temp3.jpg

          convert temp1.jpg assets/mj1.png
          convert temp2.jpg assets/mj2.png
          convert temp3.jpg assets/mj3.png

          # 自动配置 pubspec.yaml 中的 assets 声明
          if ! grep -q "assets:" pubspec.yaml; then
            echo "  assets:" >> pubspec.yaml
            echo "    - assets/mj1.png" >> pubspec.yaml
            echo "    - assets/mj2.png" >> pubspec.yaml
            echo "    - assets/mj3.png" >> pubspec.yaml
          fi

          # 配置 App Icon
          convert temp1.jpg -resize 512x512! icon.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
